name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(tr -d '\r\n' < VERSION)" = "$GITHUB_REF_NAME"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/picofarm" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Build desktop binaries
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read

  release:
    name: Create GitHub Release
    needs: [docker, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches VERSION
        shell: bash
        run: test "$(tr -d '\r\n' < VERSION)" = "$GITHUB_REF_NAME"

      - name: Download native archives
        uses: actions/download-artifact@v8
        with:
          pattern: picofarm-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Prepare checksums and installation notes
        shell: bash
        run: |
          cd release-assets
          rm -f linux-linked-libraries.txt
          test "$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)" -eq 4
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cp ../docs/DESKTOP_INSTALL.md INSTALL.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          make_latest: ${{ !contains(github.ref, '-') }}
          generate_release_notes: true
          body_path: docs/RELEASE_NOTES.md
          files: release-assets/*
