name: Deploy Site

on:
  push:
    branches: [main]
    paths: ['site/**']
  pull_request:
    branches: [main]
    paths: ['site/**']

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  # Production deploy is intentionally disabled.
  #
  # site/app/docs/deployment still documents environment variables that do not
  # exist in the codebase (DAEDALUS_*, ETSY_API_KEY, OCR_API_KEY), a desktop
  # build path that was removed with Wails, port 8080 instead of 8084, and
  # screenshots carrying the old Daedalus branding. Publishing that is worse
  # than publishing nothing, because it looks authoritative.
  #
  # Restore this job only after site/app/docs/deployment matches the real
  # configuration (PORT, UPLOAD_DIR, DATABASE_PATH, STATIC_DIR, ALLOWED_ORIGINS,
  # API_TOKEN, ENCRYPTION_KEY, ENVIRONMENT) and the screenshots are re-taken
  # with the PicoFarm UI.
